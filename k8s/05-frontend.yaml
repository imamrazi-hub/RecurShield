apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: recurshield-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: recurshield-midpoint-starter-frontend:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 3}
        resources:
          requests: {cpu: 25m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: recurshield-prod}
spec:
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
  type: NodePort
