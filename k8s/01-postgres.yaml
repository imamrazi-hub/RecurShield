# StorageClass must be configured by the cluster operator (e.g. NFS CSI or local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: recurshield-prod
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: recurshield-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: recurshield}
        - {name: POSTGRES_USER, value: recurshield}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: recurshield-secrets, key: POSTGRES_PASSWORD}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U recurshield -d recurshield"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: recurshield-prod}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
  type: ClusterIP
