apiVersion: apps/v1
kind: Deployment
metadata: {name: core-api, namespace: recurshield-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: core-api}}
  template:
    metadata: {labels: {app: core-api}}
    spec:
      containers:
      - name: core-api
        image: recurshield-midpoint-starter-core-api:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: recurshield-config}
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: recurshield-secrets, key: DATABASE_URL}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: core-api, namespace: recurshield-prod}
spec:
  selector: {app: core-api}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
