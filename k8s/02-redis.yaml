apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: recurshield-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        ports: [{containerPort: 6379}]
        readinessProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: recurshield-prod}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
  type: ClusterIP
